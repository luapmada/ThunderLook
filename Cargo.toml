[workspace]
resolver = "3"
members = ["app/src-tauri", "app/ui", "crates/model", "crates/mime", "crates/store", "crates/import-pst", "crates/mailbox"]
default-members = ["app/src-tauri", "crates/model", "crates/mime", "crates/store", "crates/import-pst", "crates/mailbox"]
exclude = ["tools/pst-probe", "vendor/outlook-pst"]

[profile.release]
codegen-units = 1
lto = true

[profile.release.package.thunderlook-ui]
opt-level = "z"
