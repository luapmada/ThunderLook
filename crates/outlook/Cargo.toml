[package]
name = "thunderlook-outlook"
version = "0.10.0"
edition = "2024"
publish = false
description = "Lien avec Outlook (COM) : calendrier commun, lu et écrit par Outlook (J9 étape 4)"

[dependencies]
thunderlook-store = { path = "../store" }
thunderlook-calendar = { path = "../calendar" }
thunderlook-contacts = { path = "../contacts" }
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mail-parser = "0.11.9"
cfb = "0.14.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
