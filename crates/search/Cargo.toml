[package]
name = "thunderlook-search"
version = "0.10.0"
edition = "2024"
publish = false
description = "Recherche globale de ThunderLook : contacts, rendez-vous, tâches et notes (moteur, sans interface)"

[dependencies]
thunderlook-store = { path = "../store" }
thunderlook-calendar = { path = "../calendar" }
thunderlook-contacts = { path = "../contacts" }
thunderlook-items = { path = "../items" }
mail-parser = "0.11.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
thunderlook-model = { path = "../model" }
