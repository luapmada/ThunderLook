[package]
name = "thunderlook-folders"
version = "0.10.0"
edition = "2024"
publish = false
description = "Gestion des dossiers de rendez-vous, contacts, tâches et notes : création, renommage, suppression, couleur des calendriers"

[dependencies]
thunderlook-store = { path = "../store" }
thunderlook-safety = { path = "../safety" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
