[package]
name = "thunderlook-calendar"
version = "0.10.0"
edition = "2024"
publish = false
description = "Calendrier de ThunderLook (J9) : rendez-vous lus depuis les sacs MAPI importés, périodicités [MS-OXOCAL]"

[dependencies]
thunderlook-store = { path = "../store" }
thunderlook-safety = { path = "../safety" }
thunderlook-model = { path = "../model" }
mail-parser = "0.11.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# Banc d'essai (`examples/bench.rs`) : lit aussi les contacts et les notes. Cycle permis, réservé aux exemples.
[dev-dependencies]
thunderlook-contacts = { path = "../contacts" }
thunderlook-items = { path = "../items" }
