[package]
name = "thunderlook-sync"
version = "0.7.0"
edition = "2024"
publish = false
description = "Comptes de ThunderLook : relève IMAP, envoi SMTP, files d'opérations et d'envoi"

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "tokio1-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
serde_json = "1.0"
