[package]
name = "thunderlook-safety"
version = "0.10.0"
edition = "2024"
publish = false
description = "Sécurité des données de ThunderLook : corbeille interne, annulation (Ctrl+Z) et sauvegardes automatiques des rendez-vous, contacts, tâches et notes"

[dependencies]
thunderlook-store = { path = "../store" }
serde_json = "1.0"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
