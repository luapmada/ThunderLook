[package]
name = "thunderlook-mailbox"
version = "0.8.0"
edition = "2024"
publish = false
description = "Lecture du stockage de ThunderLook pour l'interface : arborescence, listes triées, messages"

[dependencies]
thunderlook-model = { path = "../model" }
thunderlook-store = { path = "../store" }
thunderlook-mime = { path = "../mime" }
thunderlook-rules = { path = "../rules" }
serde_json = "1.0"
mail-parser = "0.11.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.22.1"
mail-builder = "1.0.0"
md-5 = "0.10.6"
encoding_rs = "0.8.42"
cfb = "0.14.0"
