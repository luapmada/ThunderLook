[package]
name = "thunderlook-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Interface de ThunderLook (Leptos, compilée en WebAssembly)"

[dependencies]
thunderlook-model = { path = "../../crates/model" }
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Document", "Element", "EventTarget", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Node", "NodeList", "PointerEvent", "Window"] }
console_error_panic_hook = "0.1"
icondata_core = "0.1.0"
icondata_lu = "0.1.0"
