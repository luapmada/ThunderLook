[package]
name = "thunderlook"
version = "0.7.0"
description = "ThunderLook — client de messagerie de bureau local"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "thunderlook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
thunderlook-model = { path = "../../crates/model" }
thunderlook-mailbox = { path = "../../crates/mailbox" }
thunderlook-sync = { path = "../../crates/sync" }
thunderlook-store = { path = "../../crates/store" }
tokio = { version = "1", features = ["rt"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
