[package]
name = "thunderlook"
version = "0.10.0"
description = "ThunderLook — client de messagerie de bureau local"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "thunderlook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
thunderlook-model = { path = "../../crates/model" }
thunderlook-mailbox = { path = "../../crates/mailbox" }
thunderlook-sync = { path = "../../crates/sync" }
thunderlook-store = { path = "../../crates/store" }
thunderlook-calendar = { path = "../../crates/calendar" }
thunderlook-contacts = { path = "../../crates/contacts" }
thunderlook-outlook = { path = "../../crates/outlook" }
base64 = "0.22.1"
tokio = { version = "1", features = ["rt"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Security", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
